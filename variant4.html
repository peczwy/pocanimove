<!DOCTYPE html>
<html lang="pl">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <link rel="stylesheet" href="styles/style.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #video {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>

    <video
		muted
		playsinline
		preload="auto"
		class="video"
		id="video">
	</video>

    <div class="video_text" id="text_coord">
        The coords will be here
    </div>
	
	<script>
    const params = new URLSearchParams(window.location.search);

		const videos = {
			"proof": "proof.mp4",
			"proof_2": "proof_2.mp4"
		};

		const selected = params.get("video");
		const videoFile = videos[selected] ?? "proof.mp4";

		document.getElementById("video").src = `vid/${videoFile}`;
	</script>
    <script src="scripts/common-2.js?v=6"></script>
    <script src="scripts/mouse-variant-4.js?v=6"></script>

</body>
</html>
