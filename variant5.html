<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="styles/style.css?v=3">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        #sprite {
            width: 100vw;
            height: 100vh;

            background-repeat: no-repeat;
            background-position: 0 0;

            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>

    <div
        class="video"
        id="sprite">
    </div>

    <div class="video_text" id="text_coord">
        The coords will be here
    </div>

    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);

            const selected = params.get("video") || "proof";

            const sprites = {
                proof: "vid/proof-sprite.jpg",
                proof_2: "vid/proof_2-sprite.jpg"
            };

            const spriteUrl =
                sprites[selected] ?? sprites.proof;

            document.getElementById("sprite").style.backgroundImage =
                `url("${spriteUrl}")`;
        })();
    </script>

    <script src="scripts/common-3.js?v=3"></script>
    <script src="scripts/mouse-variant-5.js?v=3"></script>

</body>
</html>
