<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="styles/style_5.css?v=5">
</head>

<body>

    <div id="sprite-container">
        <div id="sprite"></div>
    </div>

    <div class="video_text" id="text_coord">
        The coords will be here
    </div>

    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);

            const selected =
                params.get("video") || "proof";

            const sprites = {
                proof: "vid/proof-sprite.jpg",
                proof_2: "vid/proof_2-sprite.jpg"
            };

            const spriteUrl =
                sprites[selected] ?? sprites.proof;

            document.getElementById("sprite").style.backgroundImage =
                `url("${spriteUrl}")`;
        })();
    </script>

    <script src="scripts/common-3.js?v=5"></script>
    <script src="scripts/mouse-variant-5.js?v=5"></script>

</body>
</html>
